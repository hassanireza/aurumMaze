<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"><title>Game loop</title><desc>Input becomes direction names, the engine ticks at 120 hertz, and the renderer draws every frame.</desc><defs><radialGradient id="gl" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#d8b447" stop-opacity=".1"/><stop offset="1" stop-color="#070605" stop-opacity="0"/></radialGradient><style>@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-14}}@keyframes chomp1{to{transform:rotate(-30deg)}}@keyframes chomp2{to{transform:rotate(30deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}.tb{transform-box:fill-box;transform-origin:center}.k{animation:rise .8s cubic-bezier(.16,.4,.15,1) backwards}.fl{stroke-dasharray:5 6;animation:flow 1s linear infinite}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}.hb{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="420" fill="#070605"/><rect width="1200" height="420" fill="url(#gl)"/><rect x=".5" y=".5" width="1199" height="419" rx="4" fill="none" stroke="#d8b447" stroke-opacity=".16"/><g class="k" style="animation-delay:0.2s"><rect class="" x="40" y="150" width="190" height="80" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".5"/><text x="135.0" y="180" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Touch or key</text><text x="135.0" y="202" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >swipe, arrows, WASD</text></g><g class="k" style="animation-delay:0.3s"><rect class="" x="280" y="150" width="190" height="80" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".5"/><text x="375.0" y="180" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >InputManager</text><text x="375.0" y="202" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >direction names</text></g><g class="k" style="animation-delay:0.4s"><rect class="hb" x="520" y="100" width="330" height="180" rx="12" fill="#14110b" stroke="#ffd84a" stroke-opacity=".5"/><text x="685.0" y="130" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >tick(1/120 s)</text><text x="685.0" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" ></text></g><text x="545" y="168" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#f7f3e8" text-anchor="start" >1.  PacMan: turn window, buffer, travel</text><text x="545" y="194" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a79f88" text-anchor="start" >2.  Hunt clock and frightened timer</text><text x="545" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a79f88" text-anchor="start" >3.  Ghost house release rules</text><text x="545" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a79f88" text-anchor="start" >4.  Ghosts: decide at tile centres</text><text x="545" y="272" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a79f88" text-anchor="start" >5.  Pellets, fruit, collisions</text><g class="k" style="animation-delay:0.6s"><rect class="" x="900" y="60" width="260" height="80" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".5"/><text x="1030.0" y="90" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >HUD snapshot</text><text x="1030.0" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >React state, only when it changes</text></g><g class="k" style="animation-delay:0.7s"><rect class="" x="900" y="240" width="260" height="80" rx="12" fill="#14110b" stroke="#6fd8d0" stroke-opacity=".5"/><text x="1030.0" y="270" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Renderer.draw</text><text x="1030.0" y="292" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >every animation frame</text></g><line class="fl" x1="230" y1="190" x2="280" y2="190" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><line class="fl" x1="470" y1="190" x2="520" y2="190" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><line class="fl" x1="850" y1="150" x2="900" y2="100" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><line class="fl" x1="850" y1="230" x2="900" y2="280" stroke="#6fd8d0" stroke-width="1.8" stroke-linecap="round"/><text x="40" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7463" text-anchor="start" >Fixed step, variable frame: a slow frame runs several ticks, a fast frame runs none, so speed never depends on the display.</text><text x="40" y="384" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7463" text-anchor="start" >The loop pauses itself when the page is hidden or the app loses focus.</text></svg>