<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img"><title>Architecture</title><desc>Three tiers: React views and components, a pure TypeScript engine, and browser platform APIs.</desc><defs><radialGradient id="gl" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#d8b447" stop-opacity=".1"/><stop offset="1" stop-color="#070605" stop-opacity="0"/></radialGradient><style>@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-14}}@keyframes chomp1{to{transform:rotate(-30deg)}}@keyframes chomp2{to{transform:rotate(30deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}.tb{transform-box:fill-box;transform-origin:center}.k{animation:rise .8s cubic-bezier(.16,.4,.15,1) backwards}.fl{stroke-dasharray:5 6;animation:flow 1.1s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="650" fill="#070605"/><rect width="1200" height="650" fill="url(#gl)"/><rect x=".5" y=".5" width="1199" height="649" rx="4" fill="none" stroke="#d8b447" stroke-opacity=".16"/><g class="k" style="animation-delay:0.1s"><rect x="30" y="24" width="1140" height="130" rx="14" fill="#f7f3e8" fill-opacity=".02" stroke="#d8b447" stroke-opacity=".2" stroke-dasharray="3 6"/><g transform="translate(46 34)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h8a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 19V5A1.5 1.5 0 0 1 8 3.5ZM10.5 18h3"/></g></g><text x="78" y="51" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#d8b447" text-anchor="start" letter-spacin