<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img"><title>Steering model</title><desc>Pac-Man approaches a junction. A swipe up pressed inside the turn window of 0.55 tile before or after the junction centre is taken immediately.</desc><defs><radialGradient id="gl" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#d8b447" stop-opacity=".1"/><stop offset="1" stop-color="#070605" stop-opacity="0"/></radialGradient><style>@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-14}}@keyframes chomp1{to{transform:rotate(-30deg)}}@keyframes chomp2{to{transform:rotate(30deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}.tb{transform-box:fill-box;transform-origin:center}.k{animation:rise .8s cubic-bezier(.16,.4,.15,1) backwards}
@keyframes run{0%{transform:translate(0,0);opacity:1}30%{transform:translate(240px,0)}38%{transform:translate(308px,0)}62%{transform:translate(308px,-170px)}85%{transform:translate(308px,-170px);opacity:1}95%,100%{transform:translate(308px,-170px);opacity:0}}
.pc{animation:run 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes swp{0%,26%{opacity:0}28%{opacity:1;transform:translate(0,0)}36%{opacity:1;transform:translate(0,-34px)}40%,100%{opacity:0;transform:translate(0,-34px)}}
.sw{animation:swp 7s linear infinite;opacity:0}
@keyframes win{0%,100%{opacity:.5}50%{opacity:.95}}.win{animation:win 2.4s ease-in-out infinite}
@keyframes bar{0%,20%{transform:scaleX(0)}38%{transform:scaleX(1)}100%{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left;animation:bar 7s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="480" fill="#070605"/><rect width="1200" height="480" fill="url(#gl)"/><rect x=".5" y=".5" width="1199" height="479" rx="4" fill="none" stroke="#d8b447" stroke-opacity=".16"/><rect x="60" y="256.0" width="560" height="88" rx="10" fill="#14110b" stroke="#d8b447" stroke-opacity=".25"/><rect x="374.0" y="40" width="88" height="300" rx="10" fill="#14110b" stroke="#d8b447" stroke-opacity=".25"/><rect class="win" x="369.6" y="256.0" width="96.80000000000001" height="88" fill="#d8b447" fill-opacity=".16" stroke="#d8b447" stroke-dasharray="4 4" stroke-opacity=".7"/><line x1="418" y1="238.0" x2="418" y2="362.0" stroke="#f1d98a" stroke-opacity=".6" stroke-dasharray="2 5"/><text x="418" y="390.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a79f88" text-anchor="middle" >junction centre</text><path d="M369.6 358.0h96.80000000000001" stroke="#d8b447" stroke-width="1.5" marker-start="none"/><text x="418" y="412.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1d98a" text-anchor="middle" >turn window: 0.55 tile before or after</text><circle cx="90" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="130" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="170" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="210" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="250" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="290" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="330" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="370" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="410" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="450" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="490" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="530" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="570" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><circle cx="610" cy="300" r="3" fill="#f4ead0" fill-opacity=".6"/><g class="pc" style="transform-origin:0 0"><g transform="translate(110 300)"><g transform="translate(0 0) scale(1 1)"><g transform="scale(0.833)"><g><path style="transform-origin:0 0;animation:chomp1 .3s ease-in-out 0s infinite alternate" d="M-24 0A24 24 0 0 1 24 0Z" fill="#ffd84a"/></g><g><path style="transform-origin:0 0;animation:chomp2 .3s ease-in-out 0s infinite alternate" d="M-24 0A24 24 0 0 0 24 0Z" fill="#ffd84a"/></g></g></g></g></g><g class="sw"><g transform="translate(496.0 280)"><path d="M0 0v-30M-8 -22l8 -9 8 9" stroke="#ffd84a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="0" cy="6" r="9" fill="#ffd84a" fill-opacity=".3" stroke="#ffd84a"/></g></g><text x="496.0" y="334" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffd84a" text-anchor="middle" >swipe up</text><g><text x="700" y="70" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#d8b447" text-anchor="start" letter-spacing="3" >STEERING</text><text x="700" y="108" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="26" font-weight="500" fill="#f7f3e8" text-anchor="start" >Forgiving turns, arcade momentum</text></g><g class="k" style="animation-delay:0.3s"><rect x="700" y="140" width="440" height="58" rx="12" fill="#14110b" stroke="#f7f3e8" stroke-opacity="0.14"/><g transform="translate(714 157)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M12 4 8.5 7.5M12 4l3.5 3.5M12 20l-3.5-3.5M12 20l3.5-3.5M4 12h16M4 12l3.5-3.5M4 12l3.5 3.5M20 12l-3.5-3.5M20 12l-3.5 3.5"/></g></g><text x="750" y="165" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="start" >Swipe anywhere</text><text x="750" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a79f88" text-anchor="start" >No target, no buttons. Chain swipes without lifting your thumb.</text></g><g class="k" style="animation-delay:0.44999999999999996s"><rect x="700" y="210" width="440" height="58" rx="12" fill="#14110b" stroke="#f7f3e8" stroke-opacity="0.14"/><g transform="translate(714 227)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></g></g><text x="750" y="235" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="start" >0.7 s turn buffer</text><text x="750" y="254" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a79f88" text-anchor="start" >An early swipe is remembered and taken at the next legal junction.</text></g><g class="k" style="animation-delay:0.6s"><rect x="700" y="280" width="440" height="58" rx="12" fill="#14110b" stroke="#f7f3e8" stroke-opacity="0.14"/><g transform="translate(714 297)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M12 4 8.5 7.5M12 4l3.5 3.5M12 20l-3.5-3.5M12 20l3.5-3.5M4 12h16M4 12l3.5-3.5M4 12l3.5 3.5M20 12l-3.5-3.5M20 12l-3.5 3.5"/></g></g><text x="750" y="305" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="start" >Instant reverse</text><text x="750" y="324" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a79f88" text-anchor="start" >Swipe the opposite way and he turns around at once, mid corridor.</text></g><g class="k" style="animation-delay:0.75s"><rect x="700" y="350" width="440" height="58" rx="12" fill="#14110b" stroke="#f7f3e8" stroke-opacity="0.14"/><g transform="translate(714 367)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.2 7.6A8.5 8.5 0 1 0 18.2 16.4L12 12Z"/><circle cx="12.5" cy="7.3" r=".6"/></g></g><text x="750" y="375" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="start" >Never stops by himself</text><text x="750" y="394" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a79f88" text-anchor="start" >Like the arcade, Pac-Man glides until a wall blocks him.</text></g><rect x="700" y="420" width="440" height="6" rx="3" fill="#f7f3e8" fill-opacity=".1"/><rect class="bar" x="700" y="420" width="440" height="6" rx="3" fill="#d8b447"/><text x="700" y="450" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a7463" text-anchor="start" >buffer fills until the next legal turn, then clears</text></svg>