<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"><title>Deployment pipeline</title><desc>Push to main triggers GitHub Actions: checkout, Node 20, build, upload artifact, deploy to GitHub Pages.</desc><defs><radialGradient id="gl" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#d8b447" stop-opacity=".1"/><stop offset="1" stop-color="#070605" stop-opacity="0"/></radialGradient><style>@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-14}}@keyframes chomp1{to{transform:rotate(-30deg)}}@keyframes chomp2{to{transform:rotate(30deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}.tb{transform-box:fill-box;transform-origin:center}.k{animation:rise .8s cubic-bezier(.16,.4,.15,1) backwards}.fl{stroke-dasharray:5 6;animation:flow 1s linear infinite}@keyframes trav{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(1000px);opacity:0}}.pk{animation:trav 6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="300" fill="#070605"/><rect width="1200" height="300" fill="url(#gl)"/><rect x=".5" y=".5" width="1199" height="299" rx="4" fill="none" stroke="#d8b447" stroke-opacity=".16"/><g class="k" style="animation-delay:0.2s"><rect x="40" y="100" width="170" height="100" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".35"/><g transform="translate(113 116)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5v15M7 14c0-3 10-1 10-6.5M5 4.5a2 2 0 1 0 4 0 2 2 0 0 0-4 0ZM5 19.5a2 2 0 1 0 4 0 2 2 0 0 0-4 0ZM15 6a2 2 0 1 0 4 0 2 2 0 0 0-4 0Z"/></g></g><text x="125" y="168" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >git push</text><text x="125" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >main branch</text></g><line class="fl" x1="212" y1="150" x2="228" y2="150" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><g class="k" style="animation-delay:0.32s"><rect x="230" y="100" width="170" height="100" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".35"/><g transform="translate(303 116)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 19.5h14"/></g></g><text x="315" y="168" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Checkout</text><text x="315" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >actions/checkout</text></g><line class="fl" x1="402" y1="150" x2="418" y2="150" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><g class="k" style="animation-delay:0.44s"><rect x="420" y="100" width="170" height="100" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".35"/><g transform="translate(493 116)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h17v13h-17zM7 10l3 2.5L7 15M12 15h5"/></g></g><text x="505" y="168" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Node 20</text><text x="505" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >npm ci, cached</text></g><line class="fl" x1="592" y1="150" x2="608" y2="150" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><g class="k" style="animation-delay:0.56s"><rect x="610" y="100" width="170" height="100" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".35"/><g transform="translate(683 116)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3.5 6 13.5h5l-1 7 7-10h-5z"/></g></g><text x="695" y="168" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Build</text><text x="695" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >tsc -b, vite build</text></g><line class="fl" x1="782" y1="150" x2="798" y2="150" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><g class="k" style="animation-delay:0.6799999999999999s"><rect x="800" y="100" width="170" height="100" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".35"/><g transform="translate(873 116)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8zM3.5 12 12 16.5 20.5 12M3.5 16 12 20.5 20.5 16"/></g></g><text x="885" y="168" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Artifact</text><text x="885" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >dist folder</text></g><line class="fl" x1="972" y1="150" x2="988" y2="150" stroke="#d8b447" stroke-width="1.8" stroke-linecap="round"/><g class="k" style="animation-delay:0.8s"><rect x="990" y="100" width="170" height="100" rx="12" fill="#14110b" stroke="#d8b447" stroke-opacity=".35"/><g transform="translate(1063 116)"><g fill="none" stroke="#d8b447" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5a4 4 0 0 1-.6-7.95 5.5 5.5 0 0 1 10.6-.9A4.5 4.5 0 0 1 17 18.5Z"/></g></g><text x="1075" y="168" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="15" font-weight="600" fill="#f7f3e8" text-anchor="middle" >Pages</text><text x="1075" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a79f88" text-anchor="middle" >live site</text></g><g class="pk"><circle cx="70" cy="226" r="6" fill="#ffd84a"/></g><line x1="70" y1="226" x2="1100" y2="226" stroke="#f7f3e8" stroke-opacity=".12" stroke-dasharray="2 6"/><text x="40" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a7463" text-anchor="start" >Base path is /aurumMaze/ in vite.config.ts and must match the repository name.</text></svg>